<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="SPLIT — a shot timer for Pixel Watch 4">
  <!-- Presentation attributes only: GitHub's SVG sanitiser can strip <style>. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF5A1F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF5A1F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="#0A0D10"/>
  <circle cx="255" cy="170" r="200" fill="url(#glow)"/>

  <!-- ============ the face: bezel as time tape ============ -->
  <g transform="translate(255,170)">
    <circle r="104" fill="none" stroke="#1C242B" stroke-width="15"/>

    <!-- elapsed sweep -->
    <path d="M 0 -104 A 104 104 0 0 1 88 55" fill="none" stroke="#FF5A1F" stroke-width="15" stroke-linecap="round" opacity="0.30"/>

    <!-- shot ticks burned into the ring at their position in the string -->
    <g stroke="#FF5A1F" stroke-width="5" stroke-linecap="round">
      <line x1="0"    y1="-90"  x2="0"    y2="-119"/>
      <line x1="41"   y1="-80"  x2="54"   y2="-106"/>
      <line x1="70"   y1="-58"  x2="93"   y2="-77"/>
      <line x1="88"   y1="-30"  x2="117"  y2="-40"/>
      <line x1="94"   y1="4"    x2="124"  y2="5"/>
      <line x1="86"   y1="38"   x2="114"  y2="50"/>
    </g>

    <!-- second graduations -->
    <g stroke="#39434C" stroke-width="2">
      <line x1="0"    y1="-124" x2="0"    y2="-131"/>
      <line x1="118"  y1="-38"  x2="125"  y2="-40"/>
      <line x1="73"   y1="100"  x2="77"   y2="106"/>
      <line x1="-73"  y1="100"  x2="-77"  y2="106"/>
      <line x1="-118" y1="-38"  x2="-125" y2="-40"/>
    </g>

    <text x="0" y="6"  text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="46" font-weight="700" fill="#FF5A1F" letter-spacing="-2">2.33</text>
    <text x="0" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#7B8892" letter-spacing="3">6 SHOTS</text>
  </g>

  <!-- ============ wordmark ============ -->
  <g transform="translate(520,0)">
    <text x="0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="86" font-weight="700" fill="#E9EDF1" letter-spacing="18">SPLIT</text>
    <rect x="4" y="172" width="360" height="2" fill="url(#fade)"/>

    <text x="4" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#B7C0C8">A shot timer for Pixel Watch 4.</text>
    <text x="4" y="242" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#7B8892">The watch beeps, listens and times.</text>
    <text x="4" y="268" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#7B8892">The phone is a durable replica.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">
      <rect x="4"   y="292" width="128" height="26" rx="13" fill="#171F26"/>
      <text x="20"  y="309" fill="#C89A2E">WEAR OS 6</text>
      <rect x="142" y="292" width="150" height="26" rx="13" fill="#171F26"/>
      <text x="158" y="309" fill="#7B8892">JETPACK COMPOSE</text>
      <rect x="302" y="292" width="132" height="26" rx="13" fill="#171F26"/>
      <text x="318" y="309" fill="#7B8892">20.8 us / SAMPLE</text>
    </g>
  </g>
</svg>
