name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Cancel it rather than
# burning minutes finishing a build nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :wear:assembleDebug :mobile:assembleDebug --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      # Reports are far more useful than a red X when a run fails, so publish
      # them whatever the outcome.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '*/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

  ktlint:
    name: Kotlin formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ktlint
        id: ktlint-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ktlint
          key: ktlint-${{ env.KTLINT_VERSION }}
        env:
          KTLINT_VERSION: 1.8.0

      - name: Download ktlint
        env:
          KTLINT_VERSION: 1.8.0
        run: |
          mkdir -p ~/.cache/ktlint
          jar=~/.cache/ktlint/ktlint-cli-$KTLINT_VERSION-all.jar
          if [ ! -f "$jar" ]; then
            curl -sSfL -o "$jar" \
              "https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/$KTLINT_VERSION/ktlint-cli-$KTLINT_VERSION-all.jar"
          fi

      # Code style comes from .editorconfig (ktlint_code_style=intellij_idea),
      # not from a flag, so the IDE and CI cannot drift apart.
      - name: Check formatting
        env:
          KTLINT_VERSION: 1.8.0
        run: |
          java -jar ~/.cache/ktlint/ktlint-cli-$KTLINT_VERSION-all.jar \
            --reporter=plain \
            "**/src/**/*.kt" "**/*.gradle.kts"

  html:
    name: Validate browser prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # docs/index.html is a single self-contained file served by GitHub Pages.
      # These are the failure modes that actually broke it before: a missing
      # viewport made phones render it at 980px, and non-ASCII bytes turned into
      # mojibake when a server guessed the wrong charset.
      - name: Structural checks
        run: |
          f=docs/index.html
          fail=0
          check() { if grep -qF "$2" "$f"; then echo "ok   $1"; else echo "FAIL $1"; fail=1; fi }
          check "doctype"        '<!doctype html>'
          check "charset"        '<meta charset="utf-8">'
          check "viewport"       'width=device-width'
          check "closes html"    '</html>'
          check "canvas resize"  'ResizeObserver'
          # Deliberately not `grep -P`: it errors out under some locales, and an
          # errored grep in an `if` reads as "no match", silently passing.
          if python3 -c "import sys; sys.exit(1 if any(b > 127 for b in open('$f','rb').read()) else 0)"; then
            echo "ok   pure ASCII"
          else
            echo "FAIL page contains non-ASCII bytes (charset-fragile)"; fail=1
          fi
          exit $fail
